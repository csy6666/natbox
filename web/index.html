<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Natbox 控制台</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#172033;background:#f5f7fa;line-height:1.45}
    *{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{border:0;border-radius:6px;padding:8px 12px;background:#2563eb;color:#fff;cursor:pointer;transition:background .15s,opacity .15s}button:hover{background:#1d4ed8}button:disabled{cursor:wait;opacity:.55}button.secondary{background:#e8edf4;color:#27364d}button.secondary:hover{background:#dce4ee}button.danger{background:#dc2626}button.danger:hover{background:#b91c1c}button.ghost{background:transparent;color:#2563eb;padding:5px 7px}button.ghost:hover{background:#eef4ff}
    header{background:#172033;color:#fff;padding:20px 24px;border-bottom:4px solid #2563eb}header .brand{max-width:1180px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:18px}header h1{font-size:22px;margin:0 0 2px}header p{margin:0;color:#b9c5d8;font-size:13px}.header-actions{display:flex;align-items:center;gap:8px}.header-actions button{background:#263753;color:#fff}.header-actions button:hover{background:#334968}
    main{max-width:1180px;margin:22px auto;padding:0 16px}.toolbar,.panel{background:#fff;border:1px solid #dfe5ed;border-radius:8px;box-shadow:0 2px 8px rgba(26,43,68,.04)}.toolbar{padding:14px 16px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.toolbar .context{min-width:260px}.toolbar h2{font-size:18px;margin:0 0 3px}.muted{color:#687386;font-size:13px}.toolbar-actions{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.toggle{display:inline-flex;align-items:center;gap:6px;color:#526176;font-size:13px;white-space:nowrap}.toggle input{accent-color:#2563eb}
    .metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}.metric{background:#fff;border:1px solid #dfe5ed;border-radius:8px;padding:14px 16px}.metric-label{font-size:12px;color:#687386;text-transform:uppercase;letter-spacing:.04em}.metric-value{display:block;font-size:22px;font-weight:700;margin-top:5px;color:#172033}.metric-note{font-size:12px;color:#7c8798;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .panel{padding:16px;margin-bottom:16px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.panel-head h2{font-size:16px;margin:0}.panel-head .muted{margin-left:6px}.form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.form-grid.compact{grid-template-columns:repeat(4,minmax(0,1fr))}.form-grid label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:#526176}.form-grid label.full{grid-column:1/-1}.form-grid input,.form-grid select,.filter input,.filter select{width:100%;padding:8px 9px;border:1px solid #cbd5e1;border-radius:5px;background:#fff;color:#172033}.form-grid input:focus,.form-grid select:focus,.filter input:focus,.filter select:focus{outline:2px solid #bfdbfe;border-color:#60a5fa}.form-actions{grid-column:1/-1;display:flex;gap:8px;align-items:center}.details-summary{cursor:pointer;color:#27364d}.details-summary strong{margin-right:8px}
    .list-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.filter{min-width:180px}.filter input,.filter select{padding:7px 9px}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:940px}th,td{text-align:left;padding:11px 9px;border-bottom:1px solid #edf0f3;font-size:13px;vertical-align:top}th{font-size:11px;color:#687386;text-transform:uppercase;letter-spacing:.04em;background:#fafbfc;position:sticky;top:0}tbody tr:hover{background:#fbfdff}.name-cell{font-weight:650;color:#172033}.subline{display:block;color:#7c8798;font-size:12px;margin-top:3px}.status{display:inline-flex;align-items:center;gap:5px;font-weight:600}.status:before{content:"";width:7px;height:7px;border-radius:50%;background:#94a3b8}.status.running{color:#15803d}.status.running:before{background:#22c55e}.status.stopped{color:#64748b}.status.error{color:#b42318}.status.error:before{background:#ef4444}.barline{height:5px;background:#e8edf4;border-radius:99px;overflow:hidden;margin:4px 0 3px;min-width:95px}.barline span{display:block;height:100%;background:#2563eb;border-radius:inherit}.barline.warn span{background:#f59e0b}.barline.danger span{background:#dc2626}.resource-line{white-space:nowrap;color:#526176}.port-list{display:flex;flex-direction:column;gap:3px}.port-chip{display:inline-flex;align-items:center;gap:5px;color:#27364d;white-space:nowrap}.port-chip code{font-size:12px;background:#f1f5f9;padding:2px 5px;border-radius:3px}.row-actions{display:flex;gap:5px;flex-wrap:wrap;min-width:168px}.row-actions button{padding:5px 8px;font-size:12px}.empty{text-align:center;color:#7c8798;padding:30px}.notice{padding:10px 12px;border-radius:6px;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;font-size:13px;margin-bottom:14px}.message{min-height:0;margin-bottom:10px}.toast{padding:9px 12px;border-radius:6px;background:#172033;color:#fff;font-size:13px;display:inline-block;box-shadow:0 4px 12px rgba(0,0,0,.15)}.toast.error{background:#b42318}.hidden{display:none!important}
    dialog{width:min(760px,calc(100% - 28px));max-height:calc(100vh - 28px);padding:0;border:0;border-radius:9px;box-shadow:0 24px 80px rgba(15,23,42,.3);color:#172033}dialog::backdrop{background:rgba(15,23,42,.48)}.dialog-head{padding:16px 18px;border-bottom:1px solid #e5eaf0;display:flex;justify-content:space-between;align-items:center;gap:10px}.dialog-head h2{margin:0;font-size:18px}.dialog-close{background:#eef2f7;color:#334155;padding:5px 9px}.dialog-body{padding:18px;overflow:auto}.detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:16px}.detail-item{border:1px solid #e5eaf0;border-radius:6px;padding:10px}.detail-item dt{font-size:11px;color:#687386;text-transform:uppercase}.detail-item dd{margin:3px 0 0;font-weight:600;word-break:break-word}.audit-list{display:flex;flex-direction:column;gap:8px}.audit-row{border:1px solid #e5eaf0;border-radius:6px;padding:10px;display:grid;grid-template-columns:150px 1fr auto;gap:10px;align-items:start;font-size:13px}.audit-row .time{color:#687386}.audit-row .success{color:#15803d;font-weight:600}.audit-row .failure{color:#b42318;font-weight:600}
    @media(max-width:900px){.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.form-grid,.form-grid.compact{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:600px){header{padding:16px}.brand{align-items:flex-start!important;flex-direction:column}.header-actions{width:100%}main{margin:14px auto;padding:0 10px}.toolbar{align-items:flex-start}.toolbar-actions{width:100%}.metrics{grid-template-columns:1fr 1fr;gap:8px}.metric{padding:11px}.metric-value{font-size:19px}.form-grid,.form-grid.compact{grid-template-columns:1fr}.form-grid label.full{grid-column:auto}.form-actions{grid-column:auto}.panel{padding:12px}.audit-row{grid-template-columns:1fr}.detail-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<header><div class="brand"><div><h1>Natbox 控制台</h1><p>Incus / LXD Alpine NAT 容器管理</p></div><div class="header-actions"><span id="auth-state" class="muted"></span><button id="login-button" class="hidden" type="button" onclick="loginAdmin()">管理员登录</button><button id="logout" class="hidden" type="button" onclick="logout()">退出</button></div></div></header>
<main>
  <section class="toolbar"><div class="context"><h2>实例总览</h2><div id="cap" class="muted">正在检测运行时...</div><div id="host" class="muted">正在读取主机容量...</div></div><div class="toolbar-actions"><label class="toggle"><input id="auto-refresh" type="checkbox" checked> 自动刷新</label><button class="secondary" type="button" onclick="loadAll()">刷新</button><button class="secondary" type="button" onclick="openAudit()">操作记录</button><button class="secondary" type="button" onclick="openDiagnostics()">诊断</button><button class="secondary" type="button" onclick="backupNow()">备份</button><button class="secondary" type="button" onclick="reconcileNow()">对账</button><button class="secondary" type="button" onclick="document.getElementById('backup-file').click()">恢复</button><input id="backup-file" type="file" accept="application/json" hidden onchange="restoreBackup(this)"></div></section>
  <div id="message" class="message"></div><div id="auth-notice" class="notice hidden"></div>
  <section class="metrics"><div class="metric"><span class="metric-label">实例总数</span><strong id="metric-total" class="metric-value">-</strong><span id="metric-total-note" class="metric-note">等待数据</span></div><div class="metric"><span class="metric-label">运行中</span><strong id="metric-running" class="metric-value">-</strong><span id="metric-running-note" class="metric-note">-</span></div><div class="metric"><span class="metric-label">资源占用</span><strong id="metric-memory" class="metric-value">-</strong><span id="metric-memory-note" class="metric-note">容器配额汇总</span></div><div class="metric"><span class="metric-label">公网转发</span><strong id="metric-ports" class="metric-value">-</strong><span id="metric-ports-note" class="metric-note">TCP / UDP</span></div></section>
  <section class="panel"><details><summary class="details-summary"><strong>创建 Alpine 容器</strong><span class="muted">选择模板可快速套用资源配置</span></summary><form id="create" class="form-grid" style="margin-top:14px"><label>名称<input name="name" required pattern="[A-Za-z0-9][A-Za-z0-9.-]{0,62}" placeholder="nat01"></label><label>模板<select name="template" id="single-template" onchange="applyTemplate('create',this.value)"><option value="">自定义</option></select></label><label>镜像<input name="image" value="images:alpine/3.24"></label><label>内存 (MB)<input name="memoryLimitMb" type="number" min="16" value="120" required></label><label>磁盘 (GB)<input name="diskLimitGb" type="number" min="1" value="1" required></label><label>CPU 配额<input name="cpuLimit" value="12%" placeholder="12%"></label><label class="full">SSH 公钥（可选）<input name="publicKey" placeholder="ssh-ed25519 AAAA..."></label><div class="form-actions"><button type="submit">创建并启动</button><span class="muted">创建完成后可在实例列表中分配 SSH 和公网端口。</span></div></form></details></section>
  <section class="panel"><details><summary class="details-summary"><strong>批量创建实例</strong><span class="muted">预检查重名，最多 32 台</span></summary><form id="bulk" class="form-grid compact" style="margin-top:14px"><label>名称前缀<input name="prefix" value="nat" required pattern="[A-Za-z0-9][A-Za-z0-9.-]{0,58}" placeholder="nat"></label><label>起始编号<input name="startIndex" type="number" min="0" max="999999" value="1" required></label><label>数量<input name="count" type="number" min="1" max="32" value="2" required></label><label>模板<select name="template" id="bulk-template" onchange="applyTemplate('bulk',this.value)"><option value="">自定义</option></select></label><label>镜像<input name="image" value="images:alpine/3.24"></label><label>内存 (MB)<input name="memoryLimitMb" type="number" min="16" value="120" required></label><label>磁盘 (GB)<input name="diskLimitGb" type="number" min="1" value="1" required></label><label>CPU 配额<input name="cpuLimit" value="12%" placeholder="12%"></label><label class="toggle" style="align-self:end;padding-bottom:9px"><input name="allocateSSH" type="checkbox"> 自动分配 SSH 端口</label><label class="full">SSH 公钥（可选，写入每台实例）<input name="publicKey" placeholder="ssh-ed25519 AAAA..."></label><div class="form-actions"><button type="submit">批量创建并启动</button></div></form></details></section>
  <section class="panel"><div class="panel-head"><div><h2>实例列表 <span id="policy" class="muted"></span></h2><div class="muted"><span id="selected-count">0</span> 台已选择</div></div><div class="list-tools"><button class="secondary" type="button" onclick="bulkAct('start')">批量启动</button><button class="secondary" type="button" onclick="bulkAct('stop')">批量停止</button><button class="secondary" type="button" onclick="bulkAct('restart')">批量重启</button><button class="danger" type="button" onclick="bulkAct('delete')">批量删除</button><label class="filter"><input id="search" type="search" placeholder="搜索名称或 IPv4" oninput="renderRows()"></label><label class="filter"><select id="status-filter" onchange="renderRows()"><option value="all">全部状态</option><option value="Running">运行中</option><option value="Stopped">已停止</option></select></label></div></div><div class="table-wrap"><table><thead><tr><th><input id="select-all" type="checkbox" onchange="toggleAll(this.checked)"></th><th>实例</th><th>状态 / 地址</th><th>资源</th><th>流量</th><th>公网转发</th><th>操作</th></tr></thead><tbody id="rows"><tr><td colspan="7" class="empty">加载中...</td></tr></tbody></table></div></section>
</main>
<dialog id="detail-dialog"><div class="dialog-head"><h2 id="detail-title">实例详情</h2><button class="dialog-close" type="button" onclick="closeDialog('detail-dialog')">关闭</button></div><div id="detail-body" class="dialog-body"><div class="empty">加载中...</div></div></dialog>
<dialog id="audit-dialog"><div class="dialog-head"><h2>操作记录</h2><button class="dialog-close" type="button" onclick="closeDialog('audit-dialog')">关闭</button></div><div id="audit-body" class="dialog-body"><div class="empty">加载中...</div></div></dialog>
<dialog id="diagnostics-dialog"><div class="dialog-head"><h2>运行诊断</h2><button class="dialog-close" type="button" onclick="closeDialog('diagnostics-dialog')">关闭</button></div><div id="diagnostics-body" class="dialog-body"><div class="empty">加载中...</div></div></dialog>
<script>
const $=s=>document.querySelector(s), state={list:[],host:null,ports:null,cap:null,templates:[],busy:false,selected:new Set()}, esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), msg=(text,error=false)=>{const el=$('#message');el.innerHTML=text?`<span class="toast ${error?'error':''}">${esc(text)}</span>`:''};
let token=sessionStorage.getItem('natbox-token')||'',csrf=sessionStorage.getItem('natbox-csrf')||'',authMode={adminEnabled:false},refreshTimer=null;
async function api(path,opt={},retry=true){opt={...opt,headers:{...(opt.headers||{}),...(token?{Authorization:'Bearer '+token}:{}),...(csrf&&!token&&opt.method&&opt.method!=='GET'?{'X-CSRF-Token':csrf}:{})}};const r=await fetch(path,opt);if(r.status===401&&retry){if(authMode.adminEnabled){if(await loginAdmin())return api(path,opt,false)}else{const entered=prompt('请输入 Natbox 访问令牌');if(entered){token=entered;sessionStorage.setItem('natbox-token',token);return api(path,opt,false)}}}let body={};try{body=await r.json()}catch(e){throw Error(`服务返回异常 (${r.status})`)}if(!r.ok||!body.success)throw Error(body.message||`请求失败 (${r.status})`);return body.data}
async function loginAdmin(){const password=prompt('请输入 Natbox 管理员密码');if(!password)return false;try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password})}),j=await r.json();if(!j.success)throw Error(j.message||'登录失败');csrf=j.data.csrfToken||'';sessionStorage.setItem('natbox-csrf',csrf);$('#auth-state').textContent='管理员已登录';$('#login-button').classList.add('hidden');$('#logout').classList.remove('hidden');$('#auth-notice').classList.add('hidden');await loadAll();return true}catch(e){msg(e.message,true);return false}}
async function logout(){try{await fetch('/api/auth/logout',{method:'POST',headers:csrf?{'X-CSRF-Token':csrf}:{}})}finally{csrf='';sessionStorage.removeItem('natbox-csrf');$('#auth-state').textContent='';$('#login-button').classList.remove('hidden');$('#logout').classList.add('hidden');msg('已退出管理员会话')}}
function bytes(n){if(n===null||n===undefined||Number.isNaN(Number(n)))return '-';n=Number(n);if(n===0)return '0 B';const units=['B','KB','MB','GB','TB'];let i=0,v=n;while(v>=1024&&i<units.length-1){v/=1024;i++}return `${v.toFixed(i?1:0)} ${units[i]}`}
function pct(used,total){if(!total)return 0;return Math.min(100,Math.max(0,used/total*100))}
function resourceCell(x){const used=x.memory?.usageBytes||0,total=x.memory?.totalBytes||0,p=pct(used,total),level=p>90?'danger':p>75?'warn':'';return `<div class="resource-line">内存 ${bytes(used)} / ${bytes(total)}</div><div class="barline ${level}"><span style="width:${p.toFixed(1)}%"></span></div><div class="resource-line">磁盘 ${bytes(x.disk?.usageBytes||0)} / ${bytes(x.disk?.totalBytes||0)}</div>`}
function trafficCell(x){return `<div class="resource-line">↓ ${bytes(x.traffic?.rxBytes||0)}</div><div class="resource-line">↑ ${bytes(x.traffic?.txBytes||0)}</div>`}
function statusClass(status){return status==='Running'?'running':status==='Stopped'?'stopped':'error'}
function statusText(status){return status==='Running'?'运行中':status==='Stopped'?'已停止':status||'未知'}
function portCell(x){const rows=(x.portForwards||[]).map(p=>`<span class="port-chip"><code>${esc(p.protocol)}:${p.listenPort}</code> → ${p.targetPort}<button class="ghost" title="删除端口转发" onclick="removePort('${esc(x.name)}','${esc(p.protocol)}',${p.listenPort})">×</button></span>`).join('');return rows||'<span class="muted">暂无转发</span>'}
function actionCell(x){const action=x.status==='Running'?`<button class="secondary" type="button" onclick="act('${esc(x.name)}','stop')">停止</button><button class="secondary" type="button" onclick="act('${esc(x.name)}','restart')">重启</button>`:`<button type="button" onclick="act('${esc(x.name)}','start')">启动</button>`;return `<div class="row-actions"><button class="ghost" type="button" onclick="openDetails('${esc(x.name)}')">详情</button>${action}<button class="danger" type="button" onclick="removeIt('${esc(x.name)}')">删除</button></div>`}
function toggleSelection(name,checked){if(checked)state.selected.add(name);else state.selected.delete(name);$('#selected-count').textContent=state.selected.size}
function toggleAll(checked){const query=$('#search').value.trim().toLowerCase(),filter=$('#status-filter').value;state.list.filter(x=>(filter==='all'||x.status===filter)&&(!query||x.name.toLowerCase().includes(query)||(x.ipv4||'').toLowerCase().includes(query))).forEach(x=>toggleSelection(x.name,checked));renderRows()}
function renderRows(){const query=$('#search').value.trim().toLowerCase(),filter=$('#status-filter').value;const list=state.list.filter(x=>(filter==='all'||x.status===filter)&&(!query||x.name.toLowerCase().includes(query)||(x.ipv4||'').toLowerCase().includes(query)));$('#rows').innerHTML=list.length?list.map(x=>`<tr><td><input type="checkbox" ${state.selected.has(x.name)?'checked':''} onchange="toggleSelection('${esc(x.name)}',this.checked)"></td><td><span class="name-cell">${esc(x.name)}</span><span class="subline">${esc(x.type||'container')}</span></td><td><span class="status ${statusClass(x.status)}">${statusText(x.status)}</span><span class="subline">${esc(x.ipv4||'等待 IPv4')}</span></td><td>${resourceCell(x)}</td><td>${trafficCell(x)}</td><td><div class="port-list">${portCell(x)}</div><button class="ghost" type="button" onclick="openDetails('${esc(x.name)}')">管理转发与策略</button></td><td>${actionCell(x)}</td></tr>`).join(''):`<tr><td colspan="7" class="empty">${state.list.length?'没有匹配的实例':'暂无实例，先创建一个 Alpine 容器'}</td></tr>`;$('#selected-count').textContent=state.selected.size}
function updateDashboard(){const list=state.list,running=list.filter(x=>x.status==='Running'),memory=list.reduce((n,x)=>n+(x.memory?.usageBytes||0),0),memTotal=list.reduce((n,x)=>n+(x.memory?.totalBytes||0),0),forwards=list.reduce((n,x)=>n+(x.portForwards||[]).length,0),rx=list.reduce((n,x)=>n+(x.traffic?.rxBytes||0),0),tx=list.reduce((n,x)=>n+(x.traffic?.txBytes||0),0);$('#metric-total').textContent=list.length;$('#metric-total-note').textContent=`${list.filter(x=>x.status!=='Running').length} 台未运行`;$('#metric-running').textContent=running.length;$('#metric-running-note').textContent=list.length?`${Math.round(running.length/list.length*100)}% 在线`:'-';$('#metric-memory').textContent=bytes(memory);$('#metric-memory-note').textContent=`配额 ${bytes(memTotal)}`;$('#metric-ports').textContent=forwards;$('#metric-ports-note').textContent=`累计 ↓${bytes(rx)} ↑${bytes(tx)}`}
function fillTemplates(){for(const id of ['single-template','bulk-template']){const s=$('#'+id);while(s.options.length>1)s.remove(1);state.templates.forEach(t=>{const o=document.createElement('option');o.value=t.id;o.textContent=`${t.name} (${t.memoryLimitMb}MB/${t.diskLimitGb}GB)`;s.appendChild(o)})}}
function applyTemplate(formId,id){const t=state.templates.find(x=>x.id===id);if(!t)return;const f=document.getElementById(formId);for(const key of ['image','memoryLimitMb','diskLimitGb','cpuLimit'])if(f.elements[key])f.elements[key].value=t[key]}
async function loadAll(options={}){if(state.busy&&!options.silent)return;try{const [cap,host,ports,templates,list]=await Promise.all([api('/api/capabilities'),api('/api/host'),api('/api/ports'),api('/api/templates'),api('/api/containers')]);state.cap=cap;state.host=host;state.ports=ports;state.templates=templates||[];state.list=list||[];fillTemplates();$('#cap').textContent=`${cap.version||'运行时可用'} · ${(cap.networks||[]).join(', ')||'网络信息不可用'}`;$('#host').textContent=`可分配内存 ${bytes(host.memoryAllocatableBytes)} · 可分配磁盘 ${bytes(host.diskAllocatableBytes)}`;$('#policy').textContent=`端口 ${ports.publicMin}-${ports.publicMax} · SSH ${ports.sshMin}-${ports.sshMax}`;updateDashboard();renderRows();if(!options.silent)msg(`已更新 ${state.list.length} 台实例`)}catch(e){$('#cap').textContent='Natbox 或 Incus 不可用';msg(e.message,true)}}
async function openDetails(name){const dialog=$('#detail-dialog');$('#detail-title').textContent=`实例详情 · ${name}`;$('#detail-body').innerHTML='<div class="empty">正在读取运行时信息...</div>';dialog.showModal();try{const [info,policy]=await Promise.all([api('/api/containers/'+encodeURIComponent(name)+'/info'),api('/api/containers/'+encodeURIComponent(name)+'/policy')]),item=state.list.find(x=>x.name===name)||{},root=info.disk?.root||{};$('#detail-body').innerHTML=`<div class="detail-grid"><div class="detail-item"><dt>状态</dt><dd><span class="status ${statusClass(info.status)}">${statusText(info.status)}</span></dd></div><div class="detail-item"><dt>IPv4</dt><dd>${esc(item.ipv4||'-')}</dd></div><div class="detail-item"><dt>内存</dt><dd>${bytes(info.memory?.usage||0)} / ${bytes(info.memory?.total||0)}</dd></div><div class="detail-item"><dt>磁盘</dt><dd>${bytes(root.usage||0)} / ${bytes(root.total||0)}</dd></div><div class="detail-item"><dt>创建时间</dt><dd>${esc(info.created_at||'-')}</dd></div><div class="detail-item"><dt>启动时间</dt><dd>${esc(info.started_at||'-')}</dd></div></div><div class="panel-head"><h2>快捷操作</h2></div><div class="toolbar-actions" style="margin-bottom:16px"><button type="button" onclick="allocateSSH('${esc(name)}')">自动分配 SSH</button><button class="secondary" type="button" onclick="configureKey('${esc(name)}')">设置 SSH 公钥</button><button class="secondary" type="button" onclick="setPolicy('${esc(name)}')">编辑流量策略</button></div><div class="panel-head"><h2>流量策略</h2></div><div class="detail-grid"><div class="detail-item"><dt>已用流量</dt><dd>${bytes(policy.usedBytes||0)}</dd></div><div class="detail-item"><dt>流量上限</dt><dd>${policy.quotaEnforced?bytes(policy.quotaBytes):'不限'}</dd></div><div class="detail-item"><dt>剩余流量</dt><dd>${policy.quotaEnforced?bytes(policy.remainingBytes):'不限'}</dd></div><div class="detail-item"><dt>到期时间</dt><dd>${esc(policy.expiryEnforced?policy.expiresAt:'不限')}</dd></div></div><div class="panel-head"><h2>公网端口</h2></div><div class="port-list">${portCell(item)}</div><div class="form-grid compact" style="margin-top:12px"><label>协议<select id="detail-proto"><option value="tcp">TCP</option><option value="udp">UDP</option></select></label><label>公网端口<input id="detail-listen" type="number" min="1" max="65535" placeholder="例如 28080"></label><label>容器端口<input id="detail-target" type="number" min="1" max="65535" value="22"></label><div class="form-actions"><button type="button" onclick="addPortFromDetail('${esc(name)}')">添加转发</button></div></div>`}catch(e){$('#detail-body').innerHTML=`<div class="notice">${esc(e.message)}</div>`}}
function closeDialog(id){document.getElementById(id).close()}
async function openAudit(){const dialog=$('#audit-dialog');$('#audit-body').innerHTML='<div class="empty">正在读取操作记录...</div>';dialog.showModal();try{const events=await api('/api/audit?limit=60');$('#audit-body').innerHTML=events.length?`<div class="audit-list">${events.map(e=>`<div class="audit-row"><div class="time">${esc(e.createdAt)}</div><div><strong>${esc(e.action)}</strong><div class="muted">${esc(e.targetId||e.target)}${e.details?' · '+esc(e.details):''}</div></div><div class="${e.result==='success'?'success':'failure'}">${e.result==='success'?'成功':'失败'}</div></div>`).join('')}</div>`:'<div class="empty">暂无操作记录</div>'}catch(e){$('#audit-body').innerHTML=`<div class="notice">${esc(e.message)}</div>`}}
async function openDiagnostics(){const dialog=$('#diagnostics-dialog');$('#diagnostics-body').innerHTML='<div class="empty">正在读取诊断信息...</div>';dialog.showModal();try{const r=await api('/api/diagnostics'),reconcile=r.reconcile||{},drift=reconcile.desiredStateDrift||[],missing=reconcile.managedMissingRuntime||[],unmanaged=reconcile.runtimeUnmanaged||[];$('#diagnostics-body').innerHTML=`<div class="detail-grid"><div class="detail-item"><dt>Natbox</dt><dd>${esc(r.version||'-')} · 运行 ${r.uptimeSeconds||0}s</dd></div><div class="detail-item"><dt>运行时</dt><dd>${esc(r.runtime?.version||'-')}</dd></div><div class="detail-item"><dt>缺少运行时</dt><dd>${missing.length}</dd></div><div class="detail-item"><dt>状态漂移</dt><dd>${drift.length}</dd></div><div class="detail-item"><dt>未纳管实例</dt><dd>${unmanaged.length}</dd></div></div><div class="form-actions"><button type="button" onclick="repairDiagnostics()" ${drift.length?'':'disabled'}>修复期望状态漂移</button><span class="muted">只会启动或停止已纳管实例，不会处理未纳管实例或删除实例。</span></div>${r.runtimeError?`<div class="notice">${esc(r.runtimeError)}</div>`:''}`}catch(e){$('#diagnostics-body').innerHTML=`<div class="notice">${esc(e.message)}</div>`}}
async function repairDiagnostics(){if(!confirm('确认按照 Natbox 管理记录修复状态漂移？'))return;try{const r=await api('/api/reconcile/repair',{method:'POST'});msg(`已处理 ${r.repaired?.length||0} 项状态漂移`);closeDialog('diagnostics-dialog');await loadAll({silent:true})}catch(e){msg(e.message,true)}}
async function backupNow(){try{const data=await api('/api/backup'),blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`natbox-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(url);msg('备份已下载')}catch(e){msg(e.message,true)}}
async function reconcileNow(){try{const r=await api('/api/reconcile');msg(`对账完成：缺少运行时 ${r.managedMissingRuntime?.length||0}，未纳管 ${r.runtimeUnmanaged?.length||0}，状态漂移 ${r.desiredStateDrift?.length||0}`)}catch(e){msg(e.message,true)}}
async function restoreBackup(input){const file=input.files?.[0];input.value='';if(!file)return;try{const backup=JSON.parse(await file.text());if(!confirm('恢复只替换 Natbox 管理记录，不会创建或删除运行时实例。确认继续？'))return;const r=await api('/api/backup/restore',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({confirm:'RESTORE',backup})});msg(`已恢复 ${r.restoredContainers} 条管理记录`);await loadAll()}catch(e){msg(e.message,true)}}
async function act(name,action){if(state.busy)return;if(action==='delete'&&!confirm(`确认删除 ${name}？此操作会删除容器和其中数据。`))return;state.busy=true;try{await api('/api/containers/'+encodeURIComponent(name)+'/'+action,{method:'POST'});msg(`${name}：${action==='start'?'已启动':action==='stop'?'已停止':action==='restart'?'已重启':action==='delete'?'已删除':'操作完成'}`);await loadAll({silent:true})}catch(e){msg(e.message,true)}finally{state.busy=false}}
async function bulkAct(action){const names=[...state.selected];if(!names.length){msg('请先选择实例',true);return}if(action==='delete'&&!confirm(`确认删除 ${names.length} 台实例？此操作会删除容器和其中数据。`))return;state.busy=true;try{const r=await api('/api/containers/bulk/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({names,action})});const failed=(r.results||[]).filter(x=>x.result!=='success').length;msg(`批量${action==='start'?'启动':action==='stop'?'停止':action==='restart'?'重启':'删除'}完成${failed?`，失败 ${failed} 项`:''}`,failed>0);if(action==='delete')state.selected.clear();await loadAll({silent:true})}catch(e){msg(e.message,true)}finally{state.busy=false}}
async function removeIt(name){return act(name,'delete')}
async function removePort(name,protocol,listenPort){if(!confirm(`删除 ${protocol}:${listenPort} 转发？`))return;try{await api('/api/containers/'+encodeURIComponent(name)+'/ports?protocol='+encodeURIComponent(protocol)+'&listenPort='+listenPort,{method:'DELETE'});msg('端口转发已删除');await loadAll({silent:true})}catch(e){msg(e.message,true)}}
async function allocateSSH(name){try{const p=await api('/api/containers/'+encodeURIComponent(name)+'/ssh',{method:'POST'});msg(`${name} SSH 入口：公网 ${p.listenPort} → 容器 22`);await loadAll({silent:true})}catch(e){msg(e.message,true)}}
async function configureKey(name){const key=prompt('粘贴一行 SSH 公钥');if(!key)return;try{await api('/api/containers/'+encodeURIComponent(name)+'/ssh-key',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({publicKey:key})});msg('SSH 公钥已写入容器');await loadAll({silent:true})}catch(e){msg(e.message,true)}}
async function addPortFromDetail(name){const protocol=$('#detail-proto').value,listenPort=Number($('#detail-listen').value),targetPort=Number($('#detail-target').value);if(!listenPort||!targetPort){msg('请填写公网端口和容器端口',true);return}try{await api('/api/containers/'+encodeURIComponent(name)+'/ports',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({protocol,listenPort,targetPort})});msg(`${name} 已添加 ${protocol}:${listenPort} → ${targetPort}`);await loadAll({silent:true});openDetails(name)}catch(e){msg(e.message,true)}}
async function setPolicy(name){try{const current=await api('/api/containers/'+encodeURIComponent(name)+'/policy'),quota=prompt('总流量上限（字节，0 表示不限）',current.quotaBytes||0);if(quota===null)return;const expires=prompt('到期时间 RFC3339，留空表示不限',current.expiresAt||'');if(expires===null)return;await api('/api/containers/'+encodeURIComponent(name)+'/policy',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({quotaBytes:Number(quota),expiresAt:expires})});msg('策略已保存，配额基线已从当前计数重新开始');await loadAll({silent:true});if($('#detail-dialog').open)openDetails(name)}catch(e){msg(e.message,true)}}
$('#create').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),o=Object.fromEntries(f);delete o.template;o.memoryLimitMb=Number(o.memoryLimitMb);o.diskLimitGb=Number(o.diskLimitGb);state.busy=true;try{await api('/api/containers',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)});msg(`已创建 ${o.name}`);e.target.reset();await loadAll({silent:true})}catch(x){msg(x.message,true)}finally{state.busy=false}};
$('#bulk').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),o=Object.fromEntries(f);delete o.template;o.startIndex=Number(o.startIndex);o.count=Number(o.count);o.memoryLimitMb=Number(o.memoryLimitMb);o.diskLimitGb=Number(o.diskLimitGb);o.allocateSSH=f.get('allocateSSH')==='on';state.busy=true;try{const result=await api('/api/containers/bulk',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)});msg(`批量创建完成：${(result.created||[]).length} 台${result.failed?'，有失败项':''}`);await loadAll({silent:true})}catch(x){msg(x.message,true);await loadAll({silent:true})}finally{state.busy=false}};
async function bootstrap(){try{const r=await fetch('/api/auth/status'),j=await r.json();authMode=j.data||{};if(authMode.adminEnabled){$('#auth-notice').textContent='管理员认证已启用，修改操作需要登录。';$('#auth-notice').classList.remove('hidden');const me=await fetch('/api/auth/me');if(me.ok){const m=await me.json();csrf=m.data?.csrfToken||csrf;sessionStorage.setItem('natbox-csrf',csrf);$('#auth-state').textContent='管理员已登录';$('#logout').classList.remove('hidden')}else $('#login-button').classList.remove('hidden')}else{$('#auth-notice').textContent='当前使用 SSH 隧道访问，管理员认证未启用；不要把 Natbox 端口直接暴露到公网。';$('#auth-notice').classList.remove('hidden')}}catch(e){msg('无法读取认证状态',true)}await loadAll();refreshTimer=setInterval(()=>{if($('#auto-refresh').checked&&!state.busy&&!$('#detail-dialog').open&&!$('#audit-dialog').open)loadAll({silent:true})},15000)}bootstrap();
</script>
</body>
</html>
